name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Daily refresh of the stock price files that are published with the app.
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The price files (public/stock-data) are not committed. The last good set is kept in the
      # Actions cache, so a normal push does not download the ~100 MB dataset again.
      - name: Restore stock price files
        id: stock-cache
        uses: actions/cache/restore@v4
        with:
          path: app/public/stock-data
          key: stock-data-${{ github.run_id }}
          restore-keys: stock-data-

      # Runs on the daily schedule, on a manual run, and on any run that has no cached files yet.
      # The script only replaces the files after the new set passed its checks, so when it fails
      # the app is still deployed with the cached files (or without price files if there are none).
      - name: Refresh stock price files
        id: stock-refresh
        if: github.event_name != 'push' || steps.stock-cache.outputs.cache-matched-key == ''
        continue-on-error: true
        run: npm run stock-data
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}

      - name: Warn when the refresh failed
        if: steps.stock-refresh.outcome == 'failure'
        run: echo "::warning title=Stock price refresh failed::Deploying with the previously cached price files, if any."

      - name: Save stock price files
        if: steps.stock-refresh.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: app/public/stock-data
          key: stock-data-${{ github.run_id }}

      - name: Build
        run: npm run build

      # GitHub Pages serves a 404 for any deep link it doesn't recognize as
      # a static file. Copying index.html to 404.html lets the SPA's own
      # client-side router (React Router, basename-aware) take over instead,
      # since the browser's URL is unchanged when GitHub Pages serves this.
      - name: Add SPA 404 fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
